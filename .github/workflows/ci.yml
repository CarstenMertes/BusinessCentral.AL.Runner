name: CI

# Every push and PR: lint, unit + contract tests, then the corpus pass-rate report. The daily
# schedule produces one report per day even without pushes, which gives the pass-rate curve (one
# `pass-rate-<date>` artifact per day).
#
# Three jobs run in parallel, each on its own runner, so the wall time is that of the slowest one:
#
#   test           format, clippy, and every test that runs in a plain debug `cargo test`
#   corpus         release build, the corpus pass rate for every BC version, and the demand-driven
#                  compile against the eager compile (the four corpus runs go side by side)
#   release-tests  everything that needs an optimised build: the perf budgets, the tests that run
#                  the finished `al-test-cli` over the whole corpus, and the network tests
#
# Nothing is dropped by the split. The two test files that run the `al-test-cli` binary over the
# whole pinned corpus (`corpus_harness`, `dev_tooling`) are gated behind the `cli-e2e` feature of
# al-test-cli, which is on by default (so `cargo test` and `check.sh` still run them). The `test` job
# builds with `--no-default-features`, because the unoptimised binary needs minutes for them, and the
# `release-tests` job runs them with the release binary.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

env:
  # The built sidecar, for the sidecar tests and the corpus run. A missing .NET fails, not skips.
  ALRT_DOTNET_SIDECAR: ${{ github.workspace }}/target/dotnet-sidecar/AlDotNetSidecar.dll
  ALRT_REQUIRE_DOTNET: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Line tables are enough for a panic's location; full debug info made the debug test build
      # about a third slower and the dependency cache four times larger.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Default features: clippy also lints the two corpus-wide test files.
      - run: cargo clippy --all-targets -- -D warnings
      # Without the cli-e2e feature: `corpus_harness` and `dev_tooling` run in the release-tests job.
      - run: cargo test --workspace --no-default-features

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup

      # One release build serves the corpus runs below. rust-cache keeps dependencies only.
      - name: Build release binary
        run: cargo build --release -p al-test-cli

      # ADR-013 Layer A. The corpus names test-library apps that no .alpackages holds (System
      # Application Test Library, Permissions Mock, Any). They come from Microsoft's artifact feed
      # by range reads: about 1.5 MB per BC build out of a 1.3 GB artifact. Nothing is committed.
      # The cache is keyed by the newest published build of each oracle version, so a run on a
      # known build makes no request for the artifact. `--print-builds` reads only the 90 KB index.
      - name: Newest BC builds
        id: bc
        run: |
          ./target/release/al-test-cli --all-versions --print-builds | tee bc-builds.txt
          echo "key=$(tr ' \n' '--' < bc-builds.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/al-runtime/artifacts
          key: bc-artifacts-${{ steps.bc.outputs.key }}
      - name: Fetch dependency apps (warms the cache)
        run: ./target/release/al-test-cli --all-versions --fetch-deps

      # The corpus pass rate fails the job on any regression against metrics/<major>/passing.txt of
      # every version in oracle/oracle.toml (exit 1), or when the oracle and the corpus pin disagree
      # (exit 2).
      #
      # ADR-013 decision 6: the demand-driven compile of the dependency apps must never change an
      # outcome. The corpus runs a second time with every dependency routine compiled
      # (`AL_EAGER_DEPENDENCIES=1`), and no test may come out differently (pass, fail or not run).
      # A test the demand-driven compile refuses and the eager one runs shows up here as well:
      # that is a path BC runs and the demand-driven compile did not reach. `tools/demand_vs_eager.sh`
      # compares the main app and every extra suite and prints each difference with both reasons;
      # locally, `tools/demand_vs_eager.sh run` makes the runs and the comparison.
      #
      # A corpus run uses one core. The runner has four, so the normal run (all versions, one
      # process: it prints the comparison across versions) goes beside one eager run per version,
      # and the step takes as long as the normal run alone. The runs share no files (the
      # dependency cache is only read after the step above) and each stays well under 3 GB.
      - name: Corpus pass rate, and the demand-driven compile against the eager compile
        run: |
          step_start=$(date +%s)
          # --no-ratchet: the allow-listed differences fail the ratchet; compare_junit is the check.
          # --json keeps each eager run's phase times (every report has them).
          eager_pids=()
          for v in 27 28 29; do
            AL_EAGER_DEPENDENCIES=1 ./target/release/al-test-cli --bc-version $v --require-dotnet --no-ratchet \
              --junit eager-junit-$v.xml --json eager-report-$v.json > eager-$v.log 2>&1 &
            eager_pids+=($!)
          done

          status=0
          ./target/release/al-test-cli --all-versions --require-dotnet \
            --json pass-rate.json --markdown pass-rate.md --junit runtime-junit.xml || status=1
          normal_end=$(date +%s)
          # Each version's file has its own "How long it took" table: the runtime's own cost.
          cat pass-rate-*.md >> "$GITHUB_STEP_SUMMARY"

          i=0
          eager_reports=()
          for v in 27 28 29; do
            wait "${eager_pids[$i]}" || { echo "::error::the eager run for BC $v failed"; status=1; }
            i=$((i + 1))
            echo "::group::Eager run output, BC $v"
            cat eager-$v.log
            echo "::endgroup::"
            if [ -f eager-report-$v.json ]; then
              eager_reports+=(--timings-table eager-report-$v.json)
            fi
          done
          eager_end=$(date +%s)
          # The main app of each version and every extra suite (OnPrem, the isolation probes).
          tools/demand_vs_eager.sh compare . || status=1
          step_end=$(date +%s)

          {
            echo
            echo "## Why this step takes longer than the runtime"
            echo
            echo "- This step took $((step_end - step_start)) s in total."
            echo "- The normal run of all versions took $((normal_end - step_start)) s."
            echo "- Waiting for the three runs that compile every dependency took $((eager_end - normal_end)) s more."
            echo "- The comparison of the two took $((step_end - eager_end)) s."
            echo
            echo "On this 4-vCPU runner the normal run and three runs that compile every dependency"
            echo "(for the comparison) run side by side. They share the CPUs, and the step waits for the"
            echo "slowest one. So the step time is not the runtime's time. The runtime's own time per"
            echo "version is in the \"How long it took\" tables above."
            if [ ${#eager_reports[@]} -gt 0 ]; then
              echo
              echo "Runs that compile every dependency, for comparison:"
              echo
              ./target/release/al-test-cli "${eager_reports[@]}"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Date stamp
        if: always()
        id: date
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-rate-${{ steps.date.outputs.d }}-${{ github.run_id }}
          path: |
            pass-rate-*.json
            pass-rate-*.md
            runtime-junit-*.xml
            eager-junit-*.xml
            eager-report-*.json
          retention-days: 90

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup

      # Wall-clock budgets (issue #1): cold compile of the corpus within 1 s, parser throughput at
      # least 50 MB/s. #[ignore]d in plain `cargo test` because they only mean something in release.
      # This job runs nothing else at the same time, so the numbers are not disturbed.
      - name: Perf budgets
        run: |
          cargo test --release --no-fail-fast \
            -p al-syntax --test perf_parse_throughput \
            -p al-test-cli --test perf_budget \
            -p al-test-cli --test corpus_resolve_deps \
            -p al-test-cli --test platform_tables \
            -- --ignored --nocapture

      # The tests that run `al-test-cli` over the whole pinned corpus and its oracle (`--no-deps`),
      # against the release binary. The `test` job leaves them out (see the header).
      - name: CLI end-to-end tests (corpus_harness, dev_tooling)
        run: |
          cargo test --release --no-fail-fast \
            -p al-test-cli --test corpus_harness \
            -p al-test-cli --test dev_tooling

      # The only tests that use the network: Microsoft's artifact feed, read by range. They use
      # fresh cache directories, so they check the protocol and the real archives, not a cache.
      - name: Artifact feed (network)
        run: |
          cargo test --release --no-fail-fast \
            -p al-deps --test network \
            -p al-test-cli --test network_deps \
            -- --ignored --nocapture
