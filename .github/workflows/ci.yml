name: CI

# Every push and PR: lint, unit + contract tests, then the corpus pass-rate
# report. The daily schedule produces one report per day even without pushes,
# which is the spike's pass-rate curve (one `pass-rate-<date>` artifact per day).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

      # One release build serves the corpus run and the perf budgets below;
      # rust-cache keeps dependencies only, so building release twice (as
      # `cargo run --release` after a debug `cargo test` used to) paid for the
      # workspace crates twice. The corpus step now just runs the binary.
      - name: Build release binary
        run: cargo build --release -p al-test-cli

      # Fails the job on any regression against metrics/passing.txt (exit 1),
      # or when the oracle and the corpus pin disagree (exit 2).
      - name: Corpus pass rate
        run: |
          ./target/release/al-test-cli \
            --json pass-rate.json --markdown pass-rate.md --junit runtime-junit.xml
          cat pass-rate.md >> "$GITHUB_STEP_SUMMARY"

      # Wall-clock budgets (issue #1): cold compile of the corpus within 1 s,
      # parser throughput at least 50 MB/s. #[ignore]d in plain `cargo test`
      # because they only mean something in release. After the corpus step so a
      # budget failure never costs the day's pass-rate artifact.
      - name: Perf budgets
        run: |
          cargo test --release --no-fail-fast \
            -p al-syntax --test perf_parse_throughput \
            -p al-test-cli --test perf_budget \
            -- --ignored --nocapture

      - name: Date stamp
        if: always()
        id: date
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-rate-${{ steps.date.outputs.d }}-${{ github.run_id }}
          path: |
            pass-rate.json
            pass-rate.md
            runtime-junit.xml
          retention-days: 90
