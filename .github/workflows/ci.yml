name: CI

# Every push and PR: lint, unit + contract tests, then the corpus pass-rate
# report. The daily schedule produces one report per day even without pushes,
# which gives the pass-rate curve (one `pass-rate-<date>` artifact per day).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

env:
  # The built sidecar, for the sidecar tests and the corpus run. A missing .NET fails, not skips.
  ALRT_DOTNET_SIDECAR: ${{ github.workspace }}/target/dotnet-sidecar/AlDotNetSidecar.dll
  ALRT_REQUIRE_DOTNET: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # ADR-014: DotNet calls run in a .NET 8 sidecar process. The SDK builds it and the runtime
      # runs it. ICU is on the ubuntu image. CI must never skip a .NET test silently.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the .NET sidecar
        run: dotnet publish tools/dotnet-sidecar -c Release -o target/dotnet-sidecar
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

      # One release build serves the corpus run and the perf budgets below;
      # rust-cache keeps dependencies only, so building release twice (as
      # `cargo run --release` after a debug `cargo test` used to) paid for the
      # workspace crates twice. The corpus step now just runs the binary.
      - name: Build release binary
        run: cargo build --release -p al-test-cli

      # ADR-013 Layer A. The corpus names test-library apps that no .alpackages holds (System
      # Application Test Library, Permissions Mock, Any). They come from Microsoft's artifact feed
      # by range reads: about 1.5 MB per BC build out of a 1.3 GB artifact. Nothing is committed.
      # The cache is keyed by the newest published build of each oracle version, so a run on a
      # known build makes no request for the artifact. `--print-builds` reads only the 90 KB index.
      - name: Newest BC builds
        id: bc
        run: |
          ./target/release/al-test-cli --all-versions --print-builds | tee bc-builds.txt
          echo "key=$(tr ' \n' '--' < bc-builds.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/al-runtime/artifacts
          key: bc-artifacts-${{ steps.bc.outputs.key }}
      - name: Fetch dependency apps (warms the cache)
        run: ./target/release/al-test-cli --all-versions --fetch-deps

      # Fails the job on any regression against metrics/<major>/passing.txt of every version in oracle/oracle.toml (exit 1),
      # or when the oracle and the corpus pin disagree (exit 2).
      - name: Corpus pass rate
        run: |
          ./target/release/al-test-cli --all-versions --require-dotnet \
            --json pass-rate.json --markdown pass-rate.md --junit runtime-junit.xml
          cat pass-rate-*.md >> "$GITHUB_STEP_SUMMARY"

      # Wall-clock budgets (issue #1): cold compile of the corpus within 1 s,
      # parser throughput at least 50 MB/s. #[ignore]d in plain `cargo test`
      # because they only mean something in release. After the corpus step so a
      # budget failure never costs the day's pass-rate artifact.
      - name: Perf budgets
        run: |
          cargo test --release --no-fail-fast \
            -p al-syntax --test perf_parse_throughput \
            -p al-test-cli --test perf_budget \
            -p al-test-cli --test corpus_resolve_deps \
            -- --ignored --nocapture

      # The only tests that use the network: Microsoft's artifact feed, read by range. Run after
      # the cache step, so they check the protocol and the real archives, not the cache.
      - name: Artifact feed (network)
        run: |
          cargo test --release --no-fail-fast \
            -p al-deps --test network \
            -p al-test-cli --test network_deps \
            -- --ignored --nocapture

      - name: Date stamp
        if: always()
        id: date
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-rate-${{ steps.date.outputs.d }}-${{ github.run_id }}
          path: |
            pass-rate-*.json
            pass-rate-*.md
            runtime-junit-*.xml
          retention-days: 90
