[package]
name = "al-bcdb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dev command line for al-bcdb: the bcdb read commands (tables, companies, describe, read, serve, check, verify) plus a parallel export. All file access lives here (ADR-006)."

[[bin]]
name = "al-bcdb"
path = "src/main.rs"

[dependencies]
al-bcdb = { path = "../al-bcdb" }
al-bcdb-std = { path = "../al-bcdb-std" }
rayon = "1"
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
