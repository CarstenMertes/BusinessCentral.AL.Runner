[package]
name = "al-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Test helpers shared by the tests of the workspace (ADR-037 item 5): compile AL from a string, run a routine, read the result. A dev-dependency only."
publish = false

[dependencies]
al-sema.workspace = true
al-vm.workspace = true
al-builtins.workspace = true
al-ir.workspace = true
al-testrun = { workspace = true, optional = true }

[features]
# `outcomes_in`: run the tests of a codeunit the way `al-runner test` does (al-testrun).
runner = ["dep:al-testrun"]
