[package]
name = "alrunner-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "alrunner: the user command line of AL Runner v3 (ADR-016)"

[[bin]]
name = "alrunner"
path = "src/main.rs"

[features]
# Links mimalloc as the global allocator (ADR-016: musl's allocator is slow).
mimalloc = ["dep:mimalloc"]

[dependencies]
al-bcdb-std = { path = "../al-bcdb-std" }
al-rapidstart = { path = "../al-rapidstart" }
al-deps.workspace = true
al-host.workspace = true
al-sema.workspace = true
al-testrun.workspace = true
al-version.workspace = true
al-vm.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
