# cargo-deny configuration. CI runs `cargo deny check licenses` only (see .github/workflows/ci.yml).
# Advisories, bans and sources are not checked here.

[graph]
all-features = true

[licenses]
# Licenses a dependency may use. BUSL-1.1 is deliberately not here: it is this project's own
# license and only the workspace crates below may carry it (see `exceptions`).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
# Crates without a usable license expression are not allowed silently.
unlicensed = "deny"
private = { ignore = true }

exceptions = [
    # MPL-2.0, used unmodified; owner decision pending (2026-10-17)
    { crate = "im", allow = ["MPL-2.0"] },
    # MPL-2.0, used unmodified; owner decision pending (2026-10-17)
    { crate = "bitmaps", allow = ["MPL-2.0"] },
    # MPL-2.0, used unmodified; owner decision pending (2026-10-17)
    { crate = "sized-chunks", allow = ["MPL-2.0"] },
    # Workspace crates: this project's own BUSL-1.1 license.
    { crate = "al-bcdb", allow = ["BUSL-1.1"] },
    { crate = "al-bcdb-cli", allow = ["BUSL-1.1"] },
    { crate = "al-bcdb-std", allow = ["BUSL-1.1"] },
    { crate = "al-builtins", allow = ["BUSL-1.1"] },
    { crate = "al-cache", allow = ["BUSL-1.1"] },
    { crate = "al-data", allow = ["BUSL-1.1"] },
    { crate = "al-deps", allow = ["BUSL-1.1"] },
    { crate = "al-host", allow = ["BUSL-1.1"] },
    { crate = "al-ir", allow = ["BUSL-1.1"] },
    { crate = "al-link", allow = ["BUSL-1.1"] },
    { crate = "al-rapidstart", allow = ["BUSL-1.1"] },
    { crate = "al-sema", allow = ["BUSL-1.1"] },
    { crate = "al-syntax", allow = ["BUSL-1.1"] },
    { crate = "al-test-cli", allow = ["BUSL-1.1"] },
    { crate = "al-testkit", allow = ["BUSL-1.1"] },
    { crate = "al-testrun", allow = ["BUSL-1.1"] },
    { crate = "al-version", allow = ["BUSL-1.1"] },
    { crate = "al-vm", allow = ["BUSL-1.1"] },
    { crate = "alrunner-cli", allow = ["BUSL-1.1"] },
]
