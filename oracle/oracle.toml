# The isolation probe runs only in the corpus's Windows nightly (workflow "Nightly Windows", never
# in the Linux legs), under two custom test runners. The one nightly artifact that holds it is
# run 38341042967 (2026-10-13, BC 28.4, corpus master cf6e546, whose probe app is identical to the
# pin's). There is no oracle for BC 27 and 29.
[[version.suite]]
name = "isolation-function"
app = "corpus/tests/al-language-isolation-probe"
format = "xunit"
runner = 61300
bc_version = "28.4"
corpus_commit = "cf6e546793a92c482499ce86eadf0a0b13d2a742"
workflow_run = 38341042967
artifact_id = 11788517730
oracle = "28/xunit-isolation-function.xml"
baseline = "metrics/28/passing-isolation-function.txt"

# The control: the identical runner with TestIsolation = Codeunit. Real BC fails the probe's T5
# here, and the runtime must fail it too.
[[version.suite]]
name = "isolation-codeunit"
app = "corpus/tests/al-language-isolation-probe"
format = "xunit"
runner = 61301
bc_version = "28.4"
corpus_commit = "cf6e546793a92c482499ce86eadf0a0b13d2a742"
workflow_run = 38341042967
artifact_id = 11788517730
oracle = "28/xunit-isolation-codeunit.xml"
baseline = "metrics/28/passing-isolation-codeunit.txt"

