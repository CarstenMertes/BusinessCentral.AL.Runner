# One [[version]] table per BC major (ADR-015). The oracle of a major is the CI leg of its
# newest minor. `corpus_commit` is the pin (the `corpus` submodule). A JUnit file comes from the
# CI run of the pin, or of the commit named by the version's own `corpus_commit`, which the CLI
# accepts only when the corpus diff since that commit adds files under tests/ and changes none
# (ADR-007).
corpus_repo = "corpus"
corpus_app = "corpus/tests/al-language"
corpus_commit = "2c09ecd4c10a4a7146db05441bf6e5adffb65261"

[[version]]
major = 27
bc_version = "27.5"
workflow_run = 38739215829
artifact_id = 11976017829
junit = "27/junit.xml"
baseline = "metrics/27/passing.txt"

[[version.suite]]
name = "onprem"
app = "corpus/tests/al-language-onprem"
workflow_run = 38739215829
artifact_id = 11975770943
oracle = "27/junit-onprem.xml"
baseline = "metrics/27/passing-onprem.txt"

[[version]]
major = 28
bc_version = "28.5"
workflow_run = 38739215829
artifact_id = 11975934783
junit = "28/junit.xml"
baseline = "metrics/28/passing.txt"

[[version.suite]]
name = "onprem"
app = "corpus/tests/al-language-onprem"
workflow_run = 38739215829
artifact_id = 11975246271
oracle = "28/junit-onprem.xml"
baseline = "metrics/28/passing-onprem.txt"

# The isolation probe runs only in the corpus's Windows nightly (workflow "Nightly Windows", never
# in the Linux legs), under two custom test runners. The one nightly artifact that holds it is
# run 38341042967 (2026-10-13, BC 28.4, corpus master cf6e546, whose probe app is identical to the
# pin's). There is no oracle for BC 27 and 29.
[[version.suite]]
name = "isolation-function"
app = "corpus/tests/al-language-isolation-probe"
format = "xunit"
runner = 61300
bc_version = "28.4"
corpus_commit = "cf6e546793a92c482499ce86eadf0a0b13d2a742"
workflow_run = 38341042967
artifact_id = 11788517730
oracle = "28/xunit-isolation-function.xml"
baseline = "metrics/28/passing-isolation-function.txt"

# The control: the identical runner with TestIsolation = Codeunit. Real BC fails the probe's T5
# here, and the runtime must fail it too.
[[version.suite]]
name = "isolation-codeunit"
app = "corpus/tests/al-language-isolation-probe"
format = "xunit"
runner = 61301
bc_version = "28.4"
corpus_commit = "cf6e546793a92c482499ce86eadf0a0b13d2a742"
workflow_run = 38341042967
artifact_id = 11788517730
oracle = "28/xunit-isolation-codeunit.xml"
baseline = "metrics/28/passing-isolation-codeunit.txt"

