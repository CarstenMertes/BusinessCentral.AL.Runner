# Throwaway spike for ADR-014. Deliberately not a member of the root workspace
# (the empty [workspace] table below keeps cargo from looking upward).
#
# Run it:
#   (cd sidecar && dotnet build -c Release -o bin)      # .NET 8 SDK
#   cargo test --release                                  # checks; skips when .NET is missing
#   cargo run --release --bin bench                       # start-up and latency numbers
# Env: ALRT_DOTNET_SIDECAR (path to the sidecar dll), ALRT_BC_SERVICE_DIR (a cached
# BC service-tier folder). Nothing from Microsoft is stored here; DLLs are read
# from the local artifact cache at run time.
[workspace]

[package]
name = "dotnet-sidecar-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
